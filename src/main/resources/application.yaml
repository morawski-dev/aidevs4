spring:
  application:
    name: aidevs4

  ai:
    # Disable Spring AI auto-configurations we don't use (otherwise they
    # fail at startup demanding their own api-key).
    model:
      chat: openai
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

    openai:
      api-key: ${OPENROUTER_API_KEY}
      base-url: https://openrouter.ai/api
      chat:
        options:
          model: openai/gpt-4o-mini

    chat:
      observations:
        log-prompt: true
        log-completion: true

server:
  port: 3000

aidevs:
  hub:
    url: https://hub.ag3nts.org
    api-key: ${AIDEVS_API_KEY}
  proxy:
    # Full public URL of the /proxy endpoint (tunnel + path), e.g. https://abc123.ngrok-free.app/proxy
    url: ${PROXY_URL:}
    # Arbitrary alphanumeric id the Hub uses as the session id while testing
    session-id: ${PROXY_SESSION_ID:aidevsproxy01}
    # Tool-calling capable model on OpenRouter (bump if the light model misbehaves)
    model: openai/gpt-4o-mini
  railway:
    # Route to activate (route_format from help: [a-z]-[0-9]{1,2}, case-insensitive)
    route-name: ${RAILWAY_ROUTE:X-01}
    # Status that activates (opens) the route — per help's allowed_values
    activate-value: RTOPEN
    # 503 retry/backoff (the API deliberately returns 503 to simulate overload)
    max-retries: 8
    base-backoff-ms: 2000
    max-backoff-ms: 60000
    # Extra wait added on top of a detected rate-limit reset window
    rate-limit-safety-margin-ms: 500
  categorize:
    # Data file with the 10 items (rotates every few minutes — always refetched)
    csv-file: categorize.csv
    # Hard cap on batch→refine rounds. reset renews the 1.5 PP balance each attempt, so the only
    # cost of more rounds is wall time + a cheap prompt-engineer call; give the loop room to converge.
    max-iterations: 5
    # Strong model used as the "prompt engineer" that rewrites the classifier prompt from Hub errors
    engineer-model: anthropic/claude-sonnet-4-6
  failure:
    # Hub data file with the raw plant system log (downloaded fresh each run)
    log-file: failure.log
    # Token ceiling for the `logs` field. Centrala's hard limit is 1500, but its tokenizer counts
    # ~2.4% denser than our local jtokkit/cl100k (observed 1477 local == 1512 Centrala), so we aim at
    # 1400 to leave margin.
    token-budget: 1400
    # Severity levels worth keeping for root-cause analysis; INFO/DEBUG/TRACE are dropped as noise.
    levels: [WARN, ERRO, ERROR, CRIT]
    # Known plant subsystems — used to tag events, report coverage, and map technician feedback.
    subsystems: [ECCS8, WTRPMP, WTANK07, STMTURB12, WSTPOOL2, PWR01, FIRMWARE]
    # Cheap model used ONLY as a fallback to paraphrase descriptions under budget (deterministic
    # dedup + trimming usually fits without it).
    compress-model: openai/gpt-4o-mini
    # Hard cap on submit → read-feedback → augment rounds.
    max-iterations: 6
  electricity:
    # Vision model that reads each tile's cable edges (course hint: gemini-3-flash-preview is one of the better ones)
    vision-model: google/gemini-3-flash-preview
    # Cap on perceive→plan→rotate→verify rounds; residual rotations are applied each round (self-correcting)
    max-rounds: 6
    # Upscale each cropped tile before sending to the vision model (1 = off); larger tiles read more reliably
    tile-upscale: 4
    # Reads per tile, taking a per-edge majority (vision calls don't cost a /verify request)
    votes-per-tile: 3
    # Reset the board before the first round for a deterministic start
    reset-on-start: false
  mailbox:
    # Tool-calling agent model. Course hint: a cheap model is enough (search + fact extraction),
    # but it MUST support tool calling. gpt-4o-mini is the proven tool-caller in this stack
    # (task03 proxy); swap to google/gemini-3-flash-preview if you prefer the course's suggestion.
    model: openai/gpt-4o-mini
    # Outer re-prompt rounds. The mailbox is active, so we keep searching/retrying on Hub feedback.
    max-iterations: 8
    # Page size for search/getInbox (the zmail API allows 5-20).
    per-page: 20
    # Short pause between outer rounds — gives new mail time to arrive.
    retry-pause-ms: 1500
  drone:
    # Vision model that locates the dam sector on the map. Counting the grid accurately is the gate,
    # so the course recommends a strong model (openai/gpt-5.4 is best at grid counting; gpt-4o also good).
    vision-model: openai/gpt-4o
    # Model that builds the flight instructions from the docs + dam sector + Hub feedback (blank = default).
    planner-model: openai/gpt-4o-mini
    # Hard cap on submit → read-error → correct rounds.
    max-iterations: 8
    # The Żarnowiec power plant's identification code — the nominal/decoy destination.
    plant-code: PWR6132PL
    # The map endpoint rotates between an annotated frame (red grid + boosted water, parseable) and a
    # raw frame (no grid) in multi-minute windows; retry past raw frames long enough to span one.
    map-retries: 60
    map-retry-pause-ms: 4000
  firmware:
    # Tool-calling agent model. Course hint: this task needs reasoning + adaptation to a non-standard
    # shell API, so a strong model matters — anthropic/claude-sonnet-4-6 tracks context and recovers
    # from unexpected API replies far better than light models (which loop or confuse commands).
    model: anthropic/claude-sonnet-4-6
    # Outer re-prompt rounds — keep the agent going after a stall, a ban wait, or partial exploration.
    max-iterations: 6
    # Bounded retries inside ShellClient for deliberately retryable statuses (429 rate limit / 503).
    max-retries: 5
    # Pause between outer rounds (and the unit of ShellClient's linear backoff).
    retry-pause-ms: 2000
  shellaccess:
    # Tool-calling agent model. The agent must cross-reference the /data logs and apply the "day before"
    # date trap, so a strong reasoning model is used — anthropic/claude-sonnet-4-6.
    model: anthropic/claude-sonnet-4-6
    # Completion-token cap per turn. Per-turn output (a tool call + short reasoning) is small, and
    # OpenRouter 402s a request whose default budget (65536) exceeds the account's affordable tokens.
    max-tokens: 8000
    # Outer re-prompt rounds — keep the agent going after a stall or partial exploration.
    max-iterations: 8
    # Bounded retries inside ShellAccessClient for deliberately retryable statuses (429 rate limit / 503).
    max-retries: 5
    # Pause between outer rounds (and the unit of ShellAccessClient's linear backoff).
    retry-pause-ms: 2000
  evaluation:
    # Public Hub archive with ~10 000 sensor JSON files (absolute path, no apikey; unzipped in-memory).
    zip-file: /dane/sensors.zip
    # Model that classifies operator notes (anomaly type 3). Deterministic dedup collapses 10k files to a
    # few dozen distinct notes, so a strong model costs almost nothing here — and scoring is exact-set
    # match, so accuracy on the ambiguous OK/problem boundary matters more than token cost.
    classify-model: anthropic/claude-sonnet-4-6
    # Distinct notes per LLM call; small batches keep the model's 1-based index output reliable.
    note-batch-size: 40
  negotiations:
    # Full public URL of the tool endpoint (tunnel + path), registered with the Hub,
    # e.g. https://abc123.ngrok-free.app/api/negotiations
    url: ${NEGOTIATIONS_URL:}
    # Model that picks the catalog item from the agent's paraphrased request. The request reads units and
    # negation, so a strong model is used (exact-set scoring on cities, so a wrong item = wrong answer).
    match-model: anthropic/claude-sonnet-4-6
    # Catalog candidates the lexical pre-filter hands to the model per lookup (keeps the prompt small).
    shortlist-size: 35
    # Cap on the output string (UTF-8). The whole tool reply must stay under 500 bytes; 450 leaves room
    # for the {"output":"..."} JSON wrapper and any escaping.
    max-output-bytes: 450
    # How many times solve() polls /verify {action:check} for the asynchronous flag.
    max-checks: 40
    # Pause between checks (verification is asynchronous; the agent needs ~30-60s+ to run).
    check-pause-ms: 5000
    # Public Hub paths for the three S03E04 knowledge files.
    cities-file: /dane/s03e04_csv/cities.csv
    items-file: /dane/s03e04_csv/items.csv
    connections-file: /dane/s03e04_csv/connections.csv
  savethem:
    # Tool-calling recon agent model. This task needs reasoning over discovered tools and rule notes,
    # so a strong model is used (the route itself is computed deterministically, not by the LLM).
    model: anthropic/claude-sonnet-4-6
    # Outer re-prompt rounds before giving up on gathering findings.
    max-iterations: 12
    # Chat-memory window (lots of tool round-trips during discovery).
    memory-window: 120
    # Resource budgets for the whole journey (from the task brief): 10 fuel + 10 food.
    fuel-budget: 10
    food-budget: 10
    # Extra fuel a powered mode (car/rocket) burns entering a tree (T) tile (from the trees-and-burn note).
    tree-penalty: 0.2
  okoeditor:
    # Record IDs read from the OKO web panel (oko.ag3nts.org list pages) — the update-only/write-only
    # API can't list records, so IDs aren't discoverable through it. The Skolwin report (incydenty) and
    # task (zadania) share one id; the Komarowo report repurposes a spare incident (the API only
    # updates existing records — a brand-new id returns -880).
    skolwin-id: 380792b2c86d9c5be670b3bde48e187b
    komarowo-incident-id: 351c0d9c90d66b4c040fff1259dd191d
    # 6-char title codes (4-char type + 2-digit subtype): MOVE04 = animals, MOVE01 = human movement.
    animals-code: MOVE04
    human-movement-code: MOVE01
    # Bounded retries inside OkoClient for deliberately retryable statuses (429 rate limit / 503).
    max-retries: 5
    # Unit of OkoClient's linear backoff between retries.
    retry-pause-ms: 2000
  windpower:
    # Recon mode: probe the API (help + start + documentation + queue weather/turbinecheck/powerplantcheck
    # + getResult + one unlock probe) and log raw bodies to learn report shapes. Flip to false for the timed flow.
    recon: false
    # Time budget for the poll loops, kept just under the hard 40 s session limit. The weather report is
    # the long pole (~24 s to generate in recon), so the budget must comfortably exceed that; the actual
    # flow finishes ~27 s (weather ~24 s + unlock ~2 s + config/done).
    deadline-ms: 38000
    # Pause between getResult polls while waiting for queued reports to finish generating.
    poll-interval-ms: 400
    # Hard cap on getResult polls (safety net so an empty queue can't loop forever); ~200 spans the budget.
    max-poll-attempts: 200
    # Blade pitch that offers no resistance in a storm (feathered) vs. optimal pitch for production.
    # DOSTROIĆ z reconu — the real allowed values come from help / the turbine report.
    feather-pitch: 90
    production-pitch: 0
    # turbineMode values from help: 'production' enables generation, 'idle' disables the turbine.
    idle-mode: idle
    production-mode: production
  domatowo:
    # Read-only probe mode: help + getMap, just log raw bodies to learn the API contract / map legend.
    # Flip to false to run the actual search-and-rescue operation.
    recon: false
    # Action-point budget for the whole operation (brief: 300).
    max-actions: 300
    # Unit caps (brief: 8 scouts, 4 transporters).
    max-scouts: 8
    max-transporters: 4
    # Hard cap on action round-trips in one run (safety net against loops).
    max-rounds: 400
    # Bounded retries for deliberately retryable statuses (429 rate limit / 503 overload).
    max-retries: 5
    # Unit of the client's linear backoff between retries (ms).
    backoff-ms: 1000
    # Vision fallback (only used if getMap doesn't encode building height unambiguously).
    vision-model: anthropic/claude-sonnet-4-6
    preview-url: https://hub.ag3nts.org/domatowo_preview
  foodwarehouse:
    # Public Hub path to the city-needs JSON ({city: {item: qty}}); downloaded via downloadPublic.
    food-file: /dane/food4cities.json
    # Order title template (String.format), given the city name. Title format is not strictly validated.
    title-template: "Dostawa dla %s"
    # Role whose users may create transport orders. role_id 2 = "Obsługa transportów" (every seeded
    # order's creator has this role); create rejects creators outside it.
    transport-role-id: 2
    # Bounded retries inside FoodWarehouseClient for deliberately retryable statuses (429 / 503).
    max-retries: 5
    # Unit of FoodWarehouseClient's linear backoff between retries.
    retry-pause-ms: 2000
  filesystem:
    # Public Hub archive with Natan's notes (absolute path, no apikey; unzipped in-memory).
    notes-zip: /dane/natan_notes.zip
    # Model that reads the free-form Polish notes into the structured trade model. Needs semantic
    # reading (merging split first-name/surname mentions, singularising irregular Polish nouns), so a
    # strong model is used; the build/submit is deterministic.
    model: anthropic/claude-sonnet-4-6
    # Completion-token cap for the extraction. The structured output is small (~8 cities), and OpenRouter
    # 402s a request whose default budget (65536) exceeds the account's affordable tokens.
    max-tokens: 8000
    # Max actions per /verify batch (the API runs an array sequentially). ~32 actions total, so one
    # batch normally; chunked for safety.
    batch-size: 200
    # Bounded retries inside FsClient for deliberately retryable statuses (429 rate limit / 503).
    max-retries: 5
    # Unit of FsClient's linear backoff between retries (ms).
    retry-pause-ms: 2000
  reactor:
    # Hard cap on commands per run (each command = one /verify round-trip). The board is 7 wide, so a
    # clean traverse is ~6-12 commands; the cap absorbs waits/reroutes/resets.
    max-commands: 200
    # How many times the run may reset (after a crush/stall) before giving up.
    max-resets: 10
    # Bounded retries for deliberately retryable statuses (429 rate limit / 503 overload).
    max-retries: 5
    # Unit of the client's linear backoff between retries (ms).
    backoff-ms: 1000
    # Read-only probe mode: start + a few waits, just log raw bodies to learn the board JSON shape.
    recon: false
  goingthere:
    # Hard cap on TOTAL move commands across all restarts. The radio channel is jammed: a minority of
    # hints are simply wrong and can't be told apart, so a run survives by luck — we keep restarting (the
    # map re-rolls each start) until one clean traverse lands. ~0.85^11 ≈ 17% per run, so give it room.
    max-moves: 3000
    # How many times the run may start over (after a crash) before giving up.
    max-restarts: 250
    # Bounded retries for retryable statuses (429/503) and corrupted scanner/hint reads.
    max-retries: 8
    # Unit of the client's linear backoff between retries (ms).
    backoff-ms: 1000
    # Model for the radio-hint classifier. The mapping (port/starboard/bow -> left/right/front) is simple,
    # so a cheap model is enough; keep it cheap since it runs once per move.
    hint-model: openai/gpt-4o-mini
    # Completion-token cap for the classifier (output is a 1-word side). Also dodges OpenRouter 402s when
    # the default 65536 budget exceeds the account's affordable tokens.
    hint-max-tokens: 100
    # Re-request + re-classify each hint this many times and majority-vote — guards against the rare
    # classifier flip on borderline phrasing (the hint's meaning is stable per column, so a few suffice).
    hint-samples: 3
    # Row-number change of the `left` command: -1 if "left" goes to a lower row number, +1 otherwise.
    # CONFIRM with a recon run; only affects row convergence, never crash safety.
    left-row-delta: -1
    # Read-only probe mode: start + a few scanner/getmessage reads, just log raw bodies to learn shapes.
    recon: false
  radiomonitoring:
    # Vision model that OCRs text out of image attachments (the router only sends true images here).
    vision-model: openai/gpt-4o
    # Audio-capable model for transcribing audio attachments (sent as an input_audio part). Must accept
    # audio input on OpenRouter (Gemini multimodal models do).
    audio-model: google/gemini-3-flash-preview
    # Strong model for the single-shot synthesis of the 4 report fields (accuracy matters; exact-match scoring).
    synth-model: anthropic/claude-sonnet-4-6
    # Completion-token cap for the synthesis (output is tiny; avoids OpenRouter's 402 on the default 65536 budget).
    synth-max-tokens: 2000
    # Safety cap on the listen loop (the terminal "enough data" signal normally ends it first).
    max-listens: 100
    # Bounded retries inside RadiomonitoringClient for deliberately retryable statuses (429 / 503).
    max-retries: 5
    # Unit of RadiomonitoringClient's linear backoff between retries.
    retry-pause-ms: 2000
    # true = compute and log the report but skip transmit (first-run inspection of routing + facts).
    dry-run: false
  phonecall:
    # Hard cap on dialog turns in one conversation (safety net against loops).
    max-turns: 14
    # Re-start the whole scenario this many times if the conversation gets "burned".
    max-restarts: 3
    # Pause between restart attempts (ms) — the operator's suspicion ramps under rapid repeated sessions.
    restart-pause-ms: 12000
    # Identity we introduce as (brief).
    operator-name: "Tymon Gajewski"
    # Operators' secret password, given only when the operator asks to authenticate.
    password: "BARBAKAN"
    # Fallback model for classifying the operator's intent / resolving the passable road when the
    # deterministic keyword pass is ambiguous (negation-heavy replies). Blank = global default.
    classify-model: anthropic/claude-sonnet-4-6
  timetravel:
    # Recon mode: help + getConfig + a sample configure, just log raw bodies to learn the API contract
    # (field names, flux shape, stabilization hint, where the flag appears). Flip to false for the run.
    recon: false
    # Interactive mode: pause on stdin so the assistant can guide the operator step by step through the
    # manual preview toggles. Set false to only print instructions (no blocking) for a dry run / CI.
    interactive: true
    # Poll cadence and hard cap for the "wait until internalMode matches and flux=100%" loop. internalMode
    # cycles every few seconds, so ~1.5 s between getConfig reads is plenty.
    poll-interval-ms: 1500
    max-poll-attempts: 60
    # Today's date = the "present" we return to before opening the tunnel.
    present-date: "2026-06-15"
    # Jump into the future for fresh batteries.
    battery-date: "2238-11-05"
    # Tunnel target: the day before Rafał was found in the cave.
    rafal-date: "2024-11-12"

  # Audio layer (TTS + STT). OpenRouter doesn't serve TTS/Whisper, so this points at OpenAI directly
  # with its own key (OPENAI_API_KEY). Used by the phonecall task.
  audio:
    api-key: ${OPENAI_API_KEY:}
    base-url: https://api.openai.com
    tts-model: gpt-4o-mini-tts
    tts-voice: onyx
    stt-model: gpt-4o-transcribe
    language: pl

management:
  tracing:
    sampling:
      probability: 1.0
  observations:
    annotations:
      enable: true
    # Micrometer and the OTel Java agent both emit HTTP spans — drop the
    # Micrometer ones so Langfuse traces aren't cluttered with duplicates.
    enable:
      http.server.requests: false
      http.client.requests: false

otel:
  service:
    name: aidevs4
  # Langfuse's OTLP endpoint only ingests traces (/v1/traces). Disable the logs and
  # metrics exporters so they don't spam "Failed to export ... 404" against /v1/logs.
  logs:
    exporter: none
  metrics:
    exporter: none
  traces:
    exporter: otlp
  instrumentation:
    spring-webmvc:
      enabled: false
    spring-web:
      enabled: false
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:https://cloud.langfuse.com/api/public/otel}
      # Headers must be a map (key: value). LANGFUSE_AUTH_HEADER = "Basic <base64(public:secret)>"
      headers:
        Authorization: ${LANGFUSE_AUTH_HEADER:}
