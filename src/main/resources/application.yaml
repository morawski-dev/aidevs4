spring:
  application:
    name: aidevs4

  ai:
    # Disable Spring AI auto-configurations we don't use (otherwise they
    # fail at startup demanding their own api-key).
    model:
      chat: openai
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

    openai:
      api-key: ${OPENROUTER_API_KEY}
      base-url: https://openrouter.ai/api
      chat:
        options:
          model: openai/gpt-4o-mini

    chat:
      observations:
        log-prompt: true
        log-completion: true

server:
  port: 3000

aidevs:
  hub:
    url: https://hub.ag3nts.org
    api-key: ${AIDEVS_API_KEY}
  proxy:
    # Full public URL of the /proxy endpoint (tunnel + path), e.g. https://abc123.ngrok-free.app/proxy
    url: ${PROXY_URL:}
    # Arbitrary alphanumeric id the Hub uses as the session id while testing
    session-id: ${PROXY_SESSION_ID:aidevsproxy01}
    # Tool-calling capable model on OpenRouter (bump if the light model misbehaves)
    model: openai/gpt-4o-mini
  railway:
    # Route to activate (route_format from help: [a-z]-[0-9]{1,2}, case-insensitive)
    route-name: ${RAILWAY_ROUTE:X-01}
    # Status that activates (opens) the route — per help's allowed_values
    activate-value: RTOPEN
    # 503 retry/backoff (the API deliberately returns 503 to simulate overload)
    max-retries: 8
    base-backoff-ms: 2000
    max-backoff-ms: 60000
    # Extra wait added on top of a detected rate-limit reset window
    rate-limit-safety-margin-ms: 500
  categorize:
    # Data file with the 10 items (rotates every few minutes — always refetched)
    csv-file: categorize.csv
    # Hard cap on batch→refine rounds. reset renews the 1.5 PP balance each attempt, so the only
    # cost of more rounds is wall time + a cheap prompt-engineer call; give the loop room to converge.
    max-iterations: 5
    # Strong model used as the "prompt engineer" that rewrites the classifier prompt from Hub errors
    engineer-model: anthropic/claude-sonnet-4-6
  failure:
    # Hub data file with the raw plant system log (downloaded fresh each run)
    log-file: failure.log
    # Token ceiling for the `logs` field. Centrala's hard limit is 1500, but its tokenizer counts
    # ~2.4% denser than our local jtokkit/cl100k (observed 1477 local == 1512 Centrala), so we aim at
    # 1400 to leave margin.
    token-budget: 1400
    # Severity levels worth keeping for root-cause analysis; INFO/DEBUG/TRACE are dropped as noise.
    levels: [WARN, ERRO, ERROR, CRIT]
    # Known plant subsystems — used to tag events, report coverage, and map technician feedback.
    subsystems: [ECCS8, WTRPMP, WTANK07, STMTURB12, WSTPOOL2, PWR01, FIRMWARE]
    # Cheap model used ONLY as a fallback to paraphrase descriptions under budget (deterministic
    # dedup + trimming usually fits without it).
    compress-model: openai/gpt-4o-mini
    # Hard cap on submit → read-feedback → augment rounds.
    max-iterations: 6
  electricity:
    # Vision model that reads each tile's cable edges (course hint: gemini-3-flash-preview is one of the better ones)
    vision-model: google/gemini-3-flash-preview
    # Cap on perceive→plan→rotate→verify rounds; residual rotations are applied each round (self-correcting)
    max-rounds: 6
    # Upscale each cropped tile before sending to the vision model (1 = off); larger tiles read more reliably
    tile-upscale: 4
    # Reads per tile, taking a per-edge majority (vision calls don't cost a /verify request)
    votes-per-tile: 3
    # Reset the board before the first round for a deterministic start
    reset-on-start: false
  mailbox:
    # Tool-calling agent model. Course hint: a cheap model is enough (search + fact extraction),
    # but it MUST support tool calling. gpt-4o-mini is the proven tool-caller in this stack
    # (task03 proxy); swap to google/gemini-3-flash-preview if you prefer the course's suggestion.
    model: openai/gpt-4o-mini
    # Outer re-prompt rounds. The mailbox is active, so we keep searching/retrying on Hub feedback.
    max-iterations: 8
    # Page size for search/getInbox (the zmail API allows 5-20).
    per-page: 20
    # Short pause between outer rounds — gives new mail time to arrive.
    retry-pause-ms: 1500
  drone:
    # Vision model that locates the dam sector on the map. Counting the grid accurately is the gate,
    # so the course recommends a strong model (openai/gpt-5.4 is best at grid counting; gpt-4o also good).
    vision-model: openai/gpt-4o
    # Model that builds the flight instructions from the docs + dam sector + Hub feedback (blank = default).
    planner-model: openai/gpt-4o-mini
    # Hard cap on submit → read-error → correct rounds.
    max-iterations: 8
    # The Żarnowiec power plant's identification code — the nominal/decoy destination.
    plant-code: PWR6132PL
    # The map endpoint rotates between an annotated frame (red grid + boosted water, parseable) and a
    # raw frame (no grid) in multi-minute windows; retry past raw frames long enough to span one.
    map-retries: 60
    map-retry-pause-ms: 4000

management:
  tracing:
    sampling:
      probability: 1.0
  observations:
    annotations:
      enable: true
    # Micrometer and the OTel Java agent both emit HTTP spans — drop the
    # Micrometer ones so Langfuse traces aren't cluttered with duplicates.
    enable:
      http.server.requests: false
      http.client.requests: false

otel:
  service:
    name: aidevs4
  # Langfuse's OTLP endpoint only ingests traces (/v1/traces). Disable the logs and
  # metrics exporters so they don't spam "Failed to export ... 404" against /v1/logs.
  logs:
    exporter: none
  metrics:
    exporter: none
  traces:
    exporter: otlp
  instrumentation:
    spring-webmvc:
      enabled: false
    spring-web:
      enabled: false
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:https://cloud.langfuse.com/api/public/otel}
      # Headers must be a map (key: value). LANGFUSE_AUTH_HEADER = "Basic <base64(public:secret)>"
      headers:
        Authorization: ${LANGFUSE_AUTH_HEADER:}
