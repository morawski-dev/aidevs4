spring:
  application:
    name: aidevs4

  ai:
    # Disable Spring AI auto-configurations we don't use (otherwise they
    # fail at startup demanding their own api-key).
    model:
      chat: openai
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

    openai:
      api-key: ${OPENROUTER_API_KEY}
      base-url: https://openrouter.ai/api
      chat:
        options:
          model: openai/gpt-4o-mini

    chat:
      observations:
        log-prompt: true
        log-completion: true

server:
  port: 3000

aidevs:
  hub:
    url: https://hub.ag3nts.org
    api-key: ${AIDEVS_API_KEY}
  proxy:
    # Full public URL of the /proxy endpoint (tunnel + path), e.g. https://abc123.ngrok-free.app/proxy
    url: ${PROXY_URL:}
    # Arbitrary alphanumeric id the Hub uses as the session id while testing
    session-id: ${PROXY_SESSION_ID:aidevsproxy01}
    # Tool-calling capable model on OpenRouter (bump if the light model misbehaves)
    model: openai/gpt-4o-mini

management:
  tracing:
    sampling:
      probability: 1.0
  observations:
    annotations:
      enable: true
    # Micrometer and the OTel Java agent both emit HTTP spans — drop the
    # Micrometer ones so Langfuse traces aren't cluttered with duplicates.
    enable:
      http.server.requests: false
      http.client.requests: false

otel:
  service:
    name: aidevs4
  # Langfuse's OTLP endpoint only ingests traces (/v1/traces). Disable the logs and
  # metrics exporters so they don't spam "Failed to export ... 404" against /v1/logs.
  logs:
    exporter: none
  metrics:
    exporter: none
  traces:
    exporter: otlp
  instrumentation:
    spring-webmvc:
      enabled: false
    spring-web:
      enabled: false
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:https://cloud.langfuse.com/api/public/otel}
      # Headers must be a map (key: value). LANGFUSE_AUTH_HEADER = "Basic <base64(public:secret)>"
      headers:
        Authorization: ${LANGFUSE_AUTH_HEADER:}
